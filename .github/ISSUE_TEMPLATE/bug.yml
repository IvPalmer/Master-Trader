name: Bug
description: Report a reproducible defect
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction and evidence
      description: Include commit/environment and sanitized output. State what has not been verified.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and related issues
    validations:
      required: true
