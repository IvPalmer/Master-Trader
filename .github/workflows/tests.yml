name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Root tests
        run: python -m pytest tests/ -q
      - name: Killers receiver
        working-directory: services/killers-receiver
        run: python -m pytest tests/ -q
      - name: Insiders receiver
        working-directory: services/insiders-receiver
        run: python -m pytest tests/ -q
      - name: Dashboard
        working-directory: ft_userdata/ft_dashboard
        run: python -m pytest tests/ -q
      - name: Hyperliquid gateway
        working-directory: services/hl-gateway
        run: python -m pytest tests/ -q
      - name: Copier strict parsing
        run: python -m pytest killers_bot/tests/test_strict_open.py -q
      - name: Dashboard chart dependencies
        working-directory: ft_userdata/ft_dashboard/frontend
        run: npm ci
      - name: Dashboard chart types and reproducible build
        working-directory: ft_userdata/ft_dashboard/frontend
        run: |
          npm run typecheck
          npm run build
          git diff --exit-code -- ../static/price-chart.js
      - name: Install chart test browser
        working-directory: ft_userdata/ft_dashboard/frontend
        run: npx playwright install --with-deps chromium
      - name: Dashboard chart behavior
        working-directory: ft_userdata/ft_dashboard/frontend
        run: npm test
