x-healthcheck: &a2
  test:
    - CMD-SHELL
    - curl -sf http://localhost:8080/api/v1/ping || exit 1
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 120s
x-bot-env: &a1
  FREQTRADE__EXCHANGE__KEY: ${FREQTRADE__EXCHANGE__KEY}
  FREQTRADE__EXCHANGE__SECRET: ${FREQTRADE__EXCHANGE__SECRET}
  FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE__API_SERVER__USERNAME}
  FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE__API_SERVER__PASSWORD}
  FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FREQTRADE__API_SERVER__JWT_SECRET_KEY}
services:
  keltnerbouncev1:
    image: freqtradeorg/freqtrade:stable
    restart: always
    container_name: ft-keltner-bounce
    environment: *a1
    volumes:
      - ft_user_data:/freqtrade/user_data
      - ./user_data/configs:/freqtrade/user_data/configs:ro
      - ./user_data/strategies:/freqtrade/user_data/strategies
    ports:
      - 127.0.0.1:8095:8080
    healthcheck: *a2
    deploy:
      resources:
        limits:
          memory: 2G
    entrypoint:
      - /bin/sh
      - -c
      - sleep 60 && exec freqtrade trade --logfile /freqtrade/user_data/logs/KeltnerBounceV1.log --config /freqtrade/user_data/configs/KeltnerBounceV1.json --strategy KeltnerBounceV1
  fundingfadev1:
    # Re-enabled 2026-05-19 after macro gate v2 (slope + regime halt) upgrade.
    # Pause was triggered by the May 10-16 5-SL streak; new gate's bootstrap
    # P(MaxDD < baseline) = 92.5%. See project_funding_fade_gate_v2_2026-05-19.md.
    image: freqtradeorg/freqtrade:stable
    restart: always
    container_name: ft-funding-fade
    environment: *a1
    volumes:
      - ft_user_data:/freqtrade/user_data
      - ./user_data/configs:/freqtrade/user_data/configs:ro
      - ./user_data/strategies:/freqtrade/user_data/strategies
    ports:
      - 127.0.0.1:8096:8080
    healthcheck: *a2
    deploy:
      resources:
        limits:
          memory: 2G
    entrypoint:
      - /bin/sh
      - -c
      - sleep 70 && exec freqtrade trade --logfile /freqtrade/user_data/logs/FundingFadeV1.log --config /freqtrade/user_data/configs/FundingFadeV1.live.json --strategy FundingFadeV1

  oi-trend-pullback:
    image: freqtradeorg/freqtrade:stable
    restart: always
    container_name: ft-oi-trend-pullback
    environment: *a1
    volumes:
      - ft_user_data:/freqtrade/user_data
      - ./user_data/configs:/freqtrade/user_data/configs:ro
      - ./user_data/strategies:/freqtrade/user_data/strategies
    ports:
      - 127.0.0.1:8102:8080
    healthcheck: *a2
    deploy:
      resources:
        limits:
          memory: 2G
    entrypoint:
      - /bin/sh
      - -c
      - sleep 80 && exec freqtrade trade --logfile /freqtrade/user_data/logs/OITrendPullbackV1.log --config /freqtrade/user_data/configs/OITrendPullbackV1.live.json --strategy OITrendPullbackV1
  # cascadefaderv1: RETIRED 2026-07-13. Fill-stress study (prereg
  # cascade-fill-stress-2026-07): PF 1.42 at ideal fills collapses to 0.98 at
  # 0.5% entry slippage / 0.93 adversarial — the edge was a next-bar-open fill
  # assumption a rebound-buyer cannot achieve. Strategy/config/DB retained in
  # git + volume, revivable. See docs/audits/2026-07-13-oos-retest-results.md.

  # ── killers (Telegram VIP copy-trader → Hyperliquid perps) ──────────────
  # V2 forward executor. Historical results remain mixed/concentrated, but the
  # profitable warden epoch justifies continued evolution: posted-stop risk
  # sizing, <=3x leverage, active TP ladder, and stop updates are now enforced.
  # Binance Futures is unavailable to the operator in Brazil. Derivative
  # execution is therefore Hyperliquid-only; Binance remains spot/data-only.
  # Observer (host Telethon unit) intentionally NOT auto-started — shares
  # Palmer's personal Telegram session with the insiders work; restart only
  # after coordinating + a Telethon upgrade.
  killers-receiver:
    # FastAPI executor: receives classified channel events from killers_bot
    # observer (running on host via systemd/nohup) → maps to Freqtrade REST
    # /forceenter & /forceexit against ft-killers-scalp.
    build: ../services/killers-receiver
    image: killers-receiver:latest
    restart: unless-stopped
    container_name: killers-receiver
    networks:
      - default
      - dokploy-network
    environment:
      KILLERS_FT_BASE_URL: http://ft-killers-scalp:8080
      # Read from the shared anchor — sibling Freqtrade containers inherit
      # *a1 which sets FREQTRADE__API_SERVER__USERNAME/PASSWORD. Hardcoding
      # would 401 against rotated creds.
      KILLERS_FT_USERNAME: ${FREQTRADE__API_SERVER__USERNAME}
      KILLERS_FT_PASSWORD: ${FREQTRADE__API_SERVER__PASSWORD}
      # Fresh Hyperliquid epoch; the former Binance dry database remains in
      # the volume as receiver.sqlite for historical audit.
      KILLERS_DB: /var/lib/killers/receiver-hyperliquid.sqlite
      KILLERS_RISK_USD: "1"
      KILLERS_MIN_MARGIN_USD: "5"
      KILLERS_MAX_MARGIN_USD: "10"
      KILLERS_MAX_LEVERAGE: "3"
      KILLERS_REQUIRE_POSTED_SL: "true"
      KILLERS_MAX_OPEN: "5"
      # Posted-SL hard-stop mode ON (2026-06-06): force-exit a position once
      # mark breaches the signal's posted SL, instead of riding to the channel's
      # close / liquidation. Per research/killers_sl_replay this halves the loss
      # and removes liquidations. This bounded live evolution explicitly
      # supersedes the historical dry-only verdict; set "false" to revert.
      KILLERS_POSTED_SL: "true"
      KILLERS_EXECUTION_VENUE: hyperliquid
    volumes:
      - killers_receiver_state:/var/lib/killers
    ports:
      - 127.0.0.1:8089:8089
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - ft-killers-scalp

  ft-killers-scalp:
    # Hyperliquid forward bot. Pass-through strategy: all entries + exits are
    # driven by killers-receiver via REST. One dedicated API wallet per bot
    # avoids nonce contention and makes revocation independent.
    image: freqtradeorg/freqtrade:stable
    restart: always
    container_name: ft-killers-scalp
    environment:
      FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE__API_SERVER__USERNAME}
      FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE__API_SERVER__PASSWORD}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FREQTRADE__API_SERVER__JWT_SECRET_KEY}
      # Dedicated master account + agent wallet.  Do not point multiple bots
      # at the same master address: Hyperliquid nets positions per account.
      FREQTRADE__EXCHANGE__WALLET_ADDRESS: ${HYPERLIQUID_KILLERS_WALLET_ADDRESS:-}
      FREQTRADE__EXCHANGE__PRIVATE_KEY: ${HYPERLIQUID_KILLERS_PRIVATE_KEY:-}
      FREQTRADE__DRY_RUN: ${HYPERLIQUID_KILLERS_DRY_RUN:-true}
      SIGNAL_RECEIVER_URL: http://killers-receiver:8089
    volumes:
      - ft_user_data:/freqtrade/user_data
      - ./user_data/configs:/freqtrade/user_data/configs:ro
      - ./user_data/strategies:/freqtrade/user_data/strategies
    ports:
      - 127.0.0.1:8099:8080
    healthcheck: *a2
    deploy:
      resources:
        limits:
          memory: 2G
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$${FREQTRADE__DRY_RUN}" in
          true|1|yes)
            export FREQTRADE__DB_URL=sqlite:////freqtrade/user_data/tradesv3.dryrun.KillersScalpV1.hyperliquid.sqlite
            export FREQTRADE__ORDER_TYPES__STOPLOSS_ON_EXCHANGE=false
            ;;
          false|0|no)
            export FREQTRADE__DB_URL=sqlite:////freqtrade/user_data/tradesv3.live.KillersScalpV1.hyperliquid.sqlite
            ;;
          *) echo "invalid HYPERLIQUID_KILLERS_DRY_RUN value" >&2; exit 64 ;;
        esac
        sleep 60
        exec freqtrade trade --logfile /freqtrade/user_data/logs/KillersScalpV1.log --config /freqtrade/user_data/configs/KillersScalpV1.json --strategy KillersScalpV1

  ft-insiders-scalp:
    # Insiders Scalp V2 forward executor on Hyperliquid. Uses a separate API
    # wallet from Killers so the two signing streams cannot collide.
    image: freqtradeorg/freqtrade:stable
    restart: always
    container_name: ft-insiders-scalp
    environment:
      FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE__API_SERVER__USERNAME}
      FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE__API_SERVER__PASSWORD}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FREQTRADE__API_SERVER__JWT_SECRET_KEY}
      FREQTRADE__EXCHANGE__WALLET_ADDRESS: ${HYPERLIQUID_INSIDERS_WALLET_ADDRESS:-}
      FREQTRADE__EXCHANGE__PRIVATE_KEY: ${HYPERLIQUID_INSIDERS_PRIVATE_KEY:-}
      FREQTRADE__DRY_RUN: ${HYPERLIQUID_INSIDERS_DRY_RUN:-true}
      SIGNAL_RECEIVER_URL: http://insiders-receiver:8089
    volumes:
      - ft_user_data:/freqtrade/user_data
      - ./user_data/configs:/freqtrade/user_data/configs:ro
      - ./user_data/strategies:/freqtrade/user_data/strategies
    ports:
      - 127.0.0.1:8098:8080
    healthcheck: *a2
    deploy:
      resources:
        limits:
          memory: 2G
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$${FREQTRADE__DRY_RUN}" in
          true|1|yes)
            export FREQTRADE__DB_URL=sqlite:////freqtrade/user_data/tradesv3.dryrun.InsidersScalpV2.hyperliquid.sqlite
            export FREQTRADE__ORDER_TYPES__STOPLOSS_ON_EXCHANGE=false
            ;;
          false|0|no)
            export FREQTRADE__DB_URL=sqlite:////freqtrade/user_data/tradesv3.live.InsidersScalpV2.hyperliquid.sqlite
            ;;
          *) echo "invalid HYPERLIQUID_INSIDERS_DRY_RUN value" >&2; exit 64 ;;
        esac
        sleep 60
        exec freqtrade trade --logfile /freqtrade/user_data/logs/InsidersScalpV2.log --config /freqtrade/user_data/configs/InsidersScalpV2.json --strategy KillersScalpV1

  insiders-receiver:
    # FastAPI executor for the Insiders forward measurement — SAME validated
    # image as killers-receiver, pointed at ft-insiders-scalp. limit-in-zone +
    # posted-SL ON (the exit policies the killers replay validated). Fed by the
    # observer fan-out (Dennis's free channel 3501314840).
    build: ../services/killers-receiver
    image: killers-receiver:latest
    restart: unless-stopped
    container_name: insiders-receiver
    networks:
      - default
      - dokploy-network
    environment:
      KILLERS_FT_BASE_URL: http://ft-insiders-scalp:8080
      KILLERS_BOT_LABEL: insiders-scalp
      KILLERS_FT_USERNAME: ${FREQTRADE__API_SERVER__USERNAME}
      KILLERS_FT_PASSWORD: ${FREQTRADE__API_SERVER__PASSWORD}
      KILLERS_DB: /var/lib/killers/receiver-hyperliquid.sqlite
      KILLERS_RISK_USD: "1"
      KILLERS_MIN_MARGIN_USD: "5"
      KILLERS_MAX_MARGIN_USD: "10"
      KILLERS_MAX_LEVERAGE: "3"
      KILLERS_REQUIRE_POSTED_SL: "true"
      KILLERS_MAX_OPEN: "5"
      KILLERS_POSTED_SL: "true"
      KILLERS_EXECUTION_VENUE: hyperliquid
      KILLERS_NOTIFY_URL: http://trade-webhook:8088/test/notify
    volumes:
      - insiders_receiver_state:/var/lib/killers
    ports:
      - 127.0.0.1:8090:8089
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - ft-insiders-scalp

  ft-short-keltner-hl-live:
    # Autonomous Hyperliquid strategy on its own funded master account.  The
    # account separation is intentional: HL sub-accounts require $100k volume,
    # while independent master accounts keep positions and margin isolated now.
    image: freqtradeorg/freqtrade:stable
    restart: always
    container_name: ft-short-keltner-hl-live
    environment:
      FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE__API_SERVER__USERNAME}
      FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE__API_SERVER__PASSWORD}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FREQTRADE__API_SERVER__JWT_SECRET_KEY}
      FREQTRADE__EXCHANGE__WALLET_ADDRESS: ${HYPERLIQUID_SHORT_KELTNER_WALLET_ADDRESS:-}
      FREQTRADE__EXCHANGE__PRIVATE_KEY: ${HYPERLIQUID_SHORT_KELTNER_PRIVATE_KEY:-}
      FREQTRADE__DRY_RUN: ${HYPERLIQUID_SHORT_KELTNER_DRY_RUN:-true}
    volumes:
      - ft_user_data:/freqtrade/user_data
      - ./user_data/configs:/freqtrade/user_data/configs:ro
      - ./user_data/strategies:/freqtrade/user_data/strategies
    ports:
      - 127.0.0.1:8103:8080
    healthcheck: *a2
    deploy:
      resources:
        limits:
          memory: 2G
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$${FREQTRADE__DRY_RUN}" in
          true|1|yes)
            export FREQTRADE__DB_URL=sqlite:////freqtrade/user_data/tradesv3.dryrun.ShortKeltnerV2HLlive.sqlite
            export FREQTRADE__ORDER_TYPES__STOPLOSS_ON_EXCHANGE=false
            ;;
          false|0|no)
            export FREQTRADE__DB_URL=sqlite:////freqtrade/user_data/tradesv3.live.ShortKeltnerV2HLlive.sqlite
            ;;
          *) echo "invalid HYPERLIQUID_SHORT_KELTNER_DRY_RUN value" >&2; exit 64 ;;
        esac
        sleep 60
        exec freqtrade trade --logfile /freqtrade/user_data/logs/ShortKeltnerV2HLlive.log --config /freqtrade/user_data/configs/ShortKeltnerV2HL-live.json --strategy ShortKeltnerV2HL

  funding-refresh:
    image: freqtradeorg/freqtrade:stable
    restart: always
    container_name: ft-funding-refresh
    user: 1000:1000
    volumes:
      - ft_user_data:/app/user_data
      - ./download_funding_rates.py:/app/download_funding_rates.py:ro
    working_dir: /app
    deploy:
      resources:
        limits:
          memory: 256M
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          echo "[funding-refresh] $$(date -u +%FT%TZ) starting incremental refresh"
          attempt=1
          for backoff in 5 30 120; do
            if python3 -u /app/download_funding_rates.py --incremental; then
              break
            fi
            echo "[funding-refresh] attempt $$attempt failed; retrying in $${backoff}s"
            sleep "$$backoff"
            attempt=$$((attempt + 1))
          done
          if [ "$$attempt" -gt 3 ]; then
            echo "[funding-refresh] all 3 retries failed; will retry next cycle"
          fi
          # Hourly at :10, aligned to funding events (00:00/08:00/16:00 UTC).
          # A drifted 4h grid let bots trade on ~10h-old funding (ADA 2026-07-11
          # entered on a signal the fresh event had already invalidated).
          # Hourly caps staleness at ~70min past any event.
          now=$$(date -u +%s)
          slot=$$(( now / 3600 * 3600 + 600 ))
          if [ "$$now" -ge "$$slot" ]; then slot=$$(( slot + 3600 )); fi
          echo "[funding-refresh] $$(date -u +%FT%TZ) sleeping until next :10 ($$(( slot - now ))s)"
          sleep $$(( slot - now ))
        done
  metrics-exporter:
    build:
      context: .
      dockerfile: exporter/Dockerfile
    restart: unless-stopped
    container_name: ft-metrics-exporter
    environment:
      FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE__API_SERVER__USERNAME}
      FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE__API_SERVER__PASSWORD}
    volumes:
      - ./metrics_exporter.py:/app/metrics_exporter.py:ro
      - ./api_utils.py:/app/api_utils.py:ro
      - ./bots_config.json:/app/bots_config.json:ro
      - ft_exporter_state:/state
    ports:
      - 127.0.0.1:9090:9090
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - keltnerbouncev1
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    container_name: ft-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - 127.0.0.1:9091:9090
    deploy:
      resources:
        limits:
          memory: 256M
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    depends_on:
      - metrics-exporter
  ft-dashboard:
    build: ./ft_dashboard
    restart: unless-stopped
    container_name: ft-dashboard
    networks:
      - default
      - dokploy-network
    environment:
      FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE__API_SERVER__USERNAME}
      FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE__API_SERVER__PASSWORD}
      POLL_INTERVAL: "30"
      OVERLAYS_DIR: /overlays
      KILLERS_DB: /var/lib/killers/state.sqlite
      KILLERS_RECEIVER_DB: /var/lib/killers-receiver/receiver-hyperliquid.sqlite
      LINEAGE_DB_DIR: /var/lib/freqtrade-history
    volumes:
      - ./overlays:/overlays:ro
      # killers_bot SQLite (read-only) so the dashboard can render the
      # observer-bot's state alongside the Freqtrade fleet.
      - /home/ubuntu/killers-bot/state.sqlite:/var/lib/killers/state.sqlite:ro
      # live killers-receiver SQLite (target_orders) — read-only, for the
      # TP-ladder pill. Distinct path from the observer state.sqlite above.
      - killers_receiver_state:/var/lib/killers-receiver:ro
      # Retired dry-run epochs are chart lineage only. They are mounted
      # read-only and never participate in live wallet/P&L aggregation.
      - ft_user_data:/var/lib/freqtrade-history:ro
      - /home/ubuntu/hl_validation/user_data/tradesv3.snapshot.ShortKeltnerV2HL.pre-live.sqlite:/var/lib/short-keltner-history.sqlite:ro
    deploy:
      resources:
        limits:
          memory: 192M
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.master-trader.rule=Host(`master-trader.grooveops.dev`)
      - traefik.http.routers.master-trader.entrypoints=websecure
      - traefik.http.routers.master-trader.tls=true
      - traefik.http.routers.master-trader.tls.certresolver=letsencrypt
      - traefik.http.routers.master-trader.service=master-trader
      - traefik.http.services.master-trader.loadbalancer.server.port=8000
      - traefik.http.routers.master-trader-http.rule=Host(`master-trader.grooveops.dev`)
      - traefik.http.routers.master-trader-http.entrypoints=web
      - traefik.http.routers.master-trader-http.middlewares=master-trader-https-redirect@docker
      - traefik.http.middlewares.master-trader-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.master-trader-https-redirect.redirectscheme.permanent=true
    depends_on:
      - keltnerbouncev1
networks:
  default: null
  dokploy-network:
    external: true
volumes:
  prometheus_data: null
  ft_user_data: null
  ft_exporter_state: null
  insiders_state: null
  killers_receiver_state: null
  insiders_receiver_state: null
  claude_auth:
    external: true
    name: claude-assistant_claude_auth
